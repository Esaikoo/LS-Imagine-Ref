defaults:

  use_wandb: False
  log_all_metrics: False  # Console verbosity only; all scalars are always saved.
  wandb_key: None
  logdir: null
  traindir: null
  evaldir: null
  offline_traindir: ''
  offline_evaldir: ''
  resume_from: ''
  search_vnext_enabled: False
  vnext_profile_every: 32
  # Task-isolated vNext defaults.
  vnext_memory_enabled: True
  vnext_memory_dim: 128
  vnext_slots: 16
  vnext_hidden: 256
  vnext_future_dim: 128
  vnext_bootstrap_heads: 3
  vnext_lr: 0.0001
  vnext_grad_clip: 100.0
  vnext_memory_save_every: 8
  vnext_snapshot_every: 64
  vnext_aux_horizon: 8
  vnext_aux_every: 4
  vnext_min_labels: 128
  vnext_min_positives: 8
  vnext_min_calibration: 32
  vnext_max_disagreement: 0.15
  vnext_match_threshold: 0.94
  vnext_dynamic_target: False
  vnext_control: True
  vnext_interaction: True
  vnext_c_hidden: 128
  vnext_c_lr: 0.0001
  vnext_c_batch: 128
  vnext_c_tau: 0.01
  vnext_start_step: 2500
  vnext_warmup: 25000
  vnext_full_step: 100000
  vnext_search_initial: 0.05
  vnext_search_fraction: 0.1
  vnext_search_max: 0.15
  vnext_total_fraction: 0.25
  vnext_settle_limit: 12
  vnext_budget_window: 100
  vnext_base_episode_fraction: 0.2
  vnext_probe_probability: 0.15
  vnext_visible_high: 0.7
  vnext_visible_low: 0.25
  vnext_interactable_high: 0.85
  vnext_phase_hysteresis: 2
  vnext_stall_steps: 20
  vnext_interaction_protect: 32
  vnext_interact_steps: 2
  vnext_interact_retries: 2
  vnext_retry_cooldown: 20
  vnext_commit_steps: 3
  vnext_c_margin: 0.01
  vnext_c_tie_margin: 0.02
  minedojo_reset_retries: 2
  seed: 0
  deterministic_run: False
  steps: 1e6
  parallel: False
  eval_every: 20000
  eval_episode_num: 10
  log_every: 20000
  reset_every: 0
  device: 'cuda:0'
  compile: True
  precision: 32
  debug: False
  video_pred_log: True

  # A switches: architecture, auxiliary learning, and real action control.
  search_a_enabled: False
  search_a_train: True
  search_a_control: True
  search_a_horizon: 6
  search_a_hidden: 256
  search_a_loss_weight: 1.0
  search_a_future_weight: 1.0
  search_a_event_weight: 1.0
  search_a_override_prob: 0.25
  search_a_low_evidence: 0.15
  search_a_new_weight: 0.5
  search_a_discovery_weight: 1.0
  search_a_revisit_weight: 0.5
  search_a_cost_weight: 0.05
  search_a_start_step: 10000
  search_a_epsilon: 0.15
  search_a_min_labels: 128
  search_a_min_positives: 1
  search_a_margin: 0.0
  search_a_ray_distance: 32.0
  search_a_cell_size: 2.0
  search_a_model_version: 2  # Old presets retain their architecture.
  search_a_control_version: 2
  search_a_visible_weight: 0.5
  search_a_separate_optimizer: False
  search_a_shared_grad_scale: 0.1
  search_a_grad_warmup: 10000
  search_a_grad_ramp: 20000
  search_a_commit_steps: 2
  search_a_budget_window: 100
  search_a_budget_fraction: 0.2
  search_a_cooldown: 2
  search_a_revisit_gain_cap: 0.02
  search_a_min_information_gain: 0.005
  search_a_repeat_cost: 0.03
  search_a_visible_score_weight: 1.0
  search_a_visible_high: 0.6
  search_a_visible_low: 0.2
  search_a_conflict_steps: 8
  search_a_protect_interaction: True
  search_a_eval_mode: checkpoint
  env_seed: -1

  # C: real-feedback semi-Markov discrete actor-critic; optional and independent.
  search_c_model_version: 1
  search_c_imagined_weight: 0.0
  search_c_imagined_starts: 8
  search_c_actor_bonus: 0.0
  search_c_return_clip: 5.0
  search_branch_enabled: False
  search_branch_every: 100000
  search_branch_count: 3
  search_branch_prefix: 8
  search_branch_seed: 910000
  search_eval_evidence: False
  search_c_eval_mode: checkpoint
  search_c_enabled: False
  search_c_control: True
  search_c_use_predictions: True
  search_c_hidden: 128
  search_c_lr: 0.0001
  search_c_discount: 0.99
  search_c_entropy: 0.03
  search_c_target_tau: 0.01
  search_c_task_weight: 5.0
  search_c_discovery_weight: 1.0
  search_c_new_weight: 0.03
  search_c_revisit_weight: 0.01
  search_c_step_cost: 0.005
  search_c_reverse_cost: 0.02
  search_c_visibility_potential: 0.1

  # B v2: durable keyframes, recurrent belief and memory-conditioned imagination.
  search_b_enabled: False
  search_b_model_version: 2
  search_b_control: True
  search_b_dim: 128
  search_b_hidden: 128
  search_b_slots: 16
  search_b_lookback: 128
  search_b_save_every: 8
  search_b_loss_weight: 1.0
  search_b_consistency_weight: 1.0

  # Environment
  task: 'minedojo'
  size: [64, 64]
  envs: 1
  action_repeat: 1
  time_limit: 1000
  episode_max_steps_override: 0
  grayscale: False
  prefill: 2500
  reward_EMA: True

  # Model
  dyn_hidden: 512
  dyn_deter: 512
  dyn_stoch: 32
  dyn_discrete: 32
  dyn_rec_depth: 1
  dyn_mean_act: 'none'
  dyn_std_act: 'sigmoid2'
  dyn_min_std: 0.1
  grad_heads: ['decoder', 'reward', 'end', 'intrinsic', 'jump', 'jumping_steps', 'accumulated_reward']
  units: 512
  act: 'SiLU'
  norm: True
  encoder:
    {mlp_keys: '$^', cnn_keys: 'image', act: 'SiLU', norm: True, cnn_depth: 32, kernel_size: 4, minres: 4, mlp_layers: 5, mlp_units: 1024, symlog_inputs: True}
  decoder:
    {mlp_keys: '$^', cnn_keys: 'image', act: 'SiLU', norm: True, cnn_depth: 32, kernel_size: 4, minres: 4, mlp_layers: 5, mlp_units: 1024, cnn_sigmoid: False, image_dist: mse, vector_dist: symlog_mse, outscale: 1.0}
  actor:
    {layers: 2, dist: 'normal', entropy: 3e-4, unimix_ratio: 0.01, std: 'learned', min_std: 0.1, max_std: 1.0, temp: 0.1, lr: 3e-5, eps: 1e-5, grad_clip: 100.0, outscale: 1.0}
  critic:
    {layers: 2, dist: 'symlog_disc', slow_target: True, slow_target_update: 1, slow_target_fraction: 0.02, lr: 3e-5, eps: 1e-5, grad_clip: 100.0, outscale: 0.0}
  reward_head:
    {layers: 2, dist: 'symlog_disc', loss_scale: 1.0, outscale: 0.0}
  end_head:
    {layers: 2, loss_scale: 1.0, outscale: 1.0}
  jump_head:
    {layers: 2, loss_scale: 1.0, outscale: 1.0}
  concentration_score_head:
    {layers: 2, dist: 'symlog_disc', loss_scale: 1.0, outscale: 0.0}
  intrinsic_head:
    {layers: 2, dist: 'symlog_disc', loss_scale: 1.0, outscale: 0.0}
  jumping_steps_head:
    {layers: 2, dist: 'symlog_disc', loss_scale: 1.0, outscale: 0.0}
  accumulated_reward_head:
    {layers: 2, dist: 'symlog_disc', loss_scale: 1.0, outscale: 0.0}
  dyn_scale: 0.5
  rep_scale: 0.1
  kl_free: 1.0
  img_weight: 1.0
  jmp_weight: 1.0
  weight_decay: 0.0
  unimix_ratio: 0.01
  initial: 'learned'

  # Training
  batch_size: 16
  batch_length: 32
  train_ratio: 512
  pretrain: 100
  model_lr: 1e-4
  opt_eps: 1e-8
  grad_clip: 1000
  dataset_size: 1000000
  opt: 'adam'

  # Behavior.
  discount: 0.997
  discount_lambda: 0.95
  jump_prob: 0.7
  jump_prob_decay: 0.9997
  imag_horizon: 15
  max_imag_sequences_num: 1024
  imag_gradient: 'dynamics'
  imag_gradient_mix: 0.0
  eval_state_mean: False

  # Exploration
  expl_behavior: 'greedy'
  expl_until: 0
  expl_extr_scale: 0.0
  expl_intr_scale: 1.0
  disag_target: 'stoch'
  disag_log: True
  disag_models: 10
  disag_offset: 1
  disag_layers: 4
  disag_units: 400
  disag_action_cond: False

minedojo:

  long_term_branch_weight: 1.0
  gaussian_reward_weight: 1.0
  gaussian_sigma_weight: 0.5

  # rollout
  is_random: True
  agent_checkpoint_dir: ""
  rollout_image_num: 2000

  unet_batch_size: 64
  results_dir: "./results"
  name: "test"
  target_item: "log"
  steps: 1e6
  parallel: False
  envs: 1
  eval_episode_num: 3
  eval_every: 10000
  action_repeat: 1
  train_ratio: 16
  video_pred_log: true
  dyn_hidden: 1024
  dyn_deter: 4096
  units: 1024
  encoder: {mlp_keys: 'inventory|inventory_max|equipped|health|hunger|breath|obs_reward', cnn_keys: '^(image|heatmap)$', cnn_depth: 96, mlp_layers: 5, mlp_units: 1024}
  decoder: {mlp_keys: 'inventory|inventory_max|equipped|health|hunger|breath', cnn_keys: '^(image|heatmap)$', cnn_depth: 96, mlp_layers: 5, mlp_units: 1024}
  actor: {layers: 5, dist: 'onehot', std: 'none'}
  value: {layers: 5}
  reward_head: {layers: 5}
  intrinsic_head: {layers: 5}
  jumping_steps_head: {layers: 5}
  accumulated_reward_head: {layers: 5}
  end_head: {layers: 5}
  jump_head: {layers: 5}
  imag_gradient: 'reinforce'
  break_speed: 100.0
  time_limit: 36000

debug:
  debug: True
  pretrain: 1
  prefill: 1
  batch_size: 10
  batch_length: 20

# Repaired A v4: actual-prefix prediction; v3 weights need explicit migration.
apm_a:
  compile: False
  search_a_model_version: 4
  search_a_control_version: 4
  search_a_commit_steps: 3
  search_a_enabled: True
  search_b_enabled: False
  search_a_separate_optimizer: True
  search_a_revisit_weight: 0.15
  search_a_margin: 0.02
  search_a_min_labels: 512
  search_a_min_positives: 8

# Historical A v2, retained for explicit reproductions rather than new runs.
apm_a_legacy:
  compile: False
  search_a_enabled: True
  search_b_enabled: False
  search_a_model_version: 2
  search_a_control_version: 2
  search_a_separate_optimizer: False
  search_a_revisit_weight: 0.5
  search_a_margin: 0.0

# Same training budget and base model, no A architecture or privileged sensors.
apm_a_off:
  compile: False
  search_a_enabled: False

# A's representation learning without real action intervention.
apm_a_loss_only:
  search_a_enabled: True
  search_a_control: False

# Only for bounded integration tests on a 6 GB GPU; not research results.
apm_a_smoke:
  pretrain: 1
  batch_size: 1
  batch_length: 12
  train_ratio: 1
  dyn_hidden: 64
  dyn_deter: 128
  dyn_stoch: 8
  dyn_discrete: 8
  units: 64
  imag_horizon: 5
  max_imag_sequences_num: 32
  encoder: {cnn_depth: 8, mlp_layers: 1, mlp_units: 64}
  decoder: {cnn_depth: 8, mlp_layers: 1, mlp_units: 64}
  actor: {layers: 2}
  critic: {layers: 2}
  reward_head: {layers: 2}
  intrinsic_head: {layers: 2}
  jumping_steps_head: {layers: 2}
  accumulated_reward_head: {layers: 2}
  end_head: {layers: 2}
  jump_head: {layers: 2}

# B stage on top of A v2.
apm_ab:
  compile: False
  search_a_enabled: True
  search_b_enabled: True

# Fixed-checkpoint ablation: zero B inputs for A, Actor and Critic.
apm_ab_memory_off:
  search_b_control: False

# B without A: memory still conditions the original Actor/Critic.
apm_b:
  compile: False
  search_a_enabled: False
  search_b_enabled: True


# Explicit historical v3 reproduction (apply after apm_a).
apm_a_v3:
  search_a_model_version: 3
  search_a_control_version: 3
  search_a_commit_steps: 2

# New combinations explicitly select A v4, never inherit historical A v2.
apm_ab_v4:
  compile: False
  search_a_enabled: True
  search_a_model_version: 4
  search_a_control_version: 4
  search_a_commit_steps: 3
  search_a_separate_optimizer: True
  search_b_enabled: True

apm_abc:
  compile: False
  search_a_enabled: True
  search_a_model_version: 4
  search_a_control_version: 4
  search_a_commit_steps: 3
  search_a_separate_optimizer: True
  search_b_enabled: True
  search_c_enabled: True

apm_ac:
  compile: False
  search_a_enabled: True
  search_a_model_version: 4
  search_a_control_version: 4
  search_a_commit_steps: 3
  search_a_separate_optimizer: True
  search_b_enabled: False
  search_c_enabled: True

apm_bc:
  compile: False
  search_a_enabled: False
  search_b_enabled: True
  search_c_enabled: True
  search_a_control_version: 4
  search_a_commit_steps: 3

# Complete plan: A5 + B2 + C2, including calibrated imagined returns and real branches.
apm_full:
  compile: False
  search_a_enabled: True
  search_a_model_version: 5
  search_a_control_version: 4
  search_a_horizon: 8
  search_a_commit_steps: 3
  search_a_separate_optimizer: True
  search_a_min_labels: 512
  search_a_min_positives: 8
  search_b_enabled: True
  search_c_enabled: True
  search_c_model_version: 2
  search_b_model_version: 3
  search_c_imagined_weight: 0.25
  search_c_actor_bonus: 0.25
  search_branch_enabled: True
  search_eval_evidence: True

# Task-preserving ABC revision. Never migrate legacy ABC weights implicitly.
apm_vnext:
  compile: False
  search_vnext_enabled: True
  search_a_enabled: False
  search_b_enabled: False
  search_c_enabled: False
  search_branch_enabled: False
  search_eval_evidence: True
