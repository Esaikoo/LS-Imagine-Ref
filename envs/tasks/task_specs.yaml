############################################
###       Env Specs for LS-Imagine       ###
############################################

harvest_log_in_plains:
  task_id: "harvest"
  sim: minedojo
  fast_reset: 5
  sim_specs:
    target_names: "log"
    target_quantities: 1
    specified_biome: "plains"
    break_speed_multiplier: 100
  clip_specs:
    prompts: ["Cut a tree"]
  concentration_specs:
    prompts: ["Cut a tree"]
    relevance_threshold: 0.288
    relevance_temperature: 0.016
    # Gate 1
    zoom_cooldown_steps: 5
    # Gate 2
    semantic_gate_enabled: false
    semantic_min_p95_p50: 0.025
    semantic_min_cc_fraction: 0.02
    # Gate 3
    post_zoom_semantic_gate_enabled: false
    post_zoom_min_p95_gain: 0.0
    post_zoom_min_contrast_gain: -0.005
    post_zoom_min_cc_retention: 0.50
    # 最大缩放倍率
    max_zoom_factor: 3.5
  reward_specs:
    item_rewards: 
      log:
        reward: 1
  success_specs:
    reward: 0
    any:
      item:
        type: 'log'
        quantity: 1
  terminal_specs:
    max_steps: 1000
  screenshot_specs:
    reset_flag: False
    step_flag: False
  LS_Imagine_specs:
    repeat: 1

